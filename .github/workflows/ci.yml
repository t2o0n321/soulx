name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS arm64, ${{ matrix.build }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        build: [release, debug]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          uname -m
          sw_vers
          cc --version
          cmake --version

      - name: Build and run the unit tests
        run: ./scripts/build_macos.sh --test ${{ matrix.build == 'debug' && '--debug' || '' }}

      - name: Smoke test the binary
        run: |
          ./build/macos/soulx version
          ./build/macos/soulx help > /dev/null
          SOULX_HOME="$RUNNER_TEMP/soulx-home" ./build/macos/soulx list --json

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.build }}
          path: build/macos/Testing/Temporary/
          if-no-files-found: ignore
