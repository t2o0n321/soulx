name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS arm64, ${{ matrix.build }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        build: [release, debug]
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          uname -m
          sw_vers
          cc --version
          cmake --version

      - name: Build and run the unit tests
        run: ./scripts/build_macos.sh --test ${{ matrix.build == 'debug' && '--debug' || '' }}

      - name: Smoke test the binary
        run: |
          ./build/macos/soulx version
          ./build/macos/soulx help > /dev/null
          SOULX_HOME="$RUNNER_TEMP/soulx-home" ./build/macos/soulx list --json

      - name: Package SoulX.app
        if: matrix.build == 'release'
        run: |
          (cd launcher && swift build -c release --arch arm64)
          ./scripts/package_macos.sh --skip-build --no-dmg
          codesign --verify --strict --deep build/dist/SoulX.app
          build/dist/SoulX.app/Contents/Helpers/soulx version

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.build }}
          path: build/macos/Testing/Temporary/
          if-no-files-found: ignore

  launcher:
    name: Launcher (SwiftUI) build and tests
    runs-on: macos-26
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - name: Build
        run: swift build -c release
      - name: Unit tests
        run: swift test
